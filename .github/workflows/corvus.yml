name: Corvus Engine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  corvus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer, pie
      # PIE needs root to write the extension dir, and sudo drops the user's Composer auth.
      - run: sudo --preserve-env=COMPOSER_AUTH "$(command -v pie)" install corvus-dotnet/corvus-json-schema
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: Assert the extension is loaded
        run: php -r 'extension_loaded("corvus_json_schema") || exit(1);'
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit tests/JsonSchema tests/Module/JsonSchemaModuleTest.php
